[workspace]
members = [
    "crates/editor-engine",
    "crates/editor-protocol",
    "crates/editor-wasm",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

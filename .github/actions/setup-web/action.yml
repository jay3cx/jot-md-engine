name: Set up web build
description: Install the workspace dependencies and matching WASM binding generator
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '24'
        package-manager-cache: false
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
    - run: pnpm install --frozen-lockfile
      shell: bash
    - name: Install wasm-bindgen CLI
      shell: bash
      env:
        WASM_BINDGEN_VERSION: '0.2.126'
      run: |
        rustc --version
        cd "$RUNNER_TEMP"
        name="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
        curl --fail --silent --show-error --location --retry 3 \
          "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${name}.tar.gz" \
          --output "${name}.tar.gz"
        printf '%s  %s\n' '064948d58e2d6c0a745216477a639ba696216d6309aaa902939d1b865b1d869d' "${name}.tar.gz" | sha256sum --check
        tar -xzf "${name}.tar.gz"
        printf '%s\n' "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  web:
    name: Web and package
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - run: pnpm run test:ts
      - run: pnpm run typecheck
      - run: pnpm run package:verify
      - run: pnpm run benchmark:build
      - run: pnpm run test:browser demo
        env:
          JOT_DEMO_BROWSER_BASE: /jot-preview/
      - name: Upload Demo for Pages
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && vars.DEPLOY_DEMO == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/demo

  pages:
    name: Deploy Demo
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && vars.DEPLOY_DEMO == 'true'
    needs: [rust, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: github-pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deploy

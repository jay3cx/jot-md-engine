[package]
name = "editor-wasm"
version = "0.1.0"
description = "WebAssembly bindings and request routing for the Jot Markdown editor"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
editor-engine = { version = "0.1.0", path = "../editor-engine" }
editor-protocol = { version = "0.1.0", path = "../editor-protocol" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true

